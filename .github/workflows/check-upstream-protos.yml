name: Check upstream tacticalapi

# Weekly drift check against Rheinmetall/tacticalapi. The plugin pins the
# upstream `.proto` files to a git ref (TacticalApiProtoRef in the src
# .csproj) for reproducibility — without this, any upstream push would
# silently change the bytes a `dotnet pack` produces from the same
# Bowire-side commit. The trade-off is that we miss upstream fixes /
# additions unless we deliberately bump.
#
# The ref is a commit SHA today because upstream has no release tags yet.
# This workflow runs once a week, resolves the pinned ref, compares it
# against upstream `main` HEAD, and posts (or updates) a single open issue
# labelled `upstream-bump` summarising what's changed — with a special
# call-out for changes to `.proto` files (the only thing that actually
# affects our generated client), and another when upstream has cut a tag
# the pin should move to. Pure docs/test/README changes upstream get an
# FYI entry but don't escalate.

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays, 07:00 UTC — early enough for a working-day inbox
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned ref against upstream HEAD and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: Rheinmetall/tacticalapi
          UPSTREAM_BRANCH: main
          LABEL: upstream-bump
        run: |
          set -euo pipefail

          # The pinned ref lives in the src .csproj as
          #   <TacticalApiProtoRef>REF</TacticalApiProtoRef>
          # where REF is a tag name or a commit SHA. Resolve it to a SHA
          # through the API so both forms compare the same way.
          PINNED_REF=$(grep -oE '<TacticalApiProtoRef>[^<]+</TacticalApiProtoRef>' \
            src/Kuestenlogik.Bowire.Protocol.TacticalApi/Kuestenlogik.Bowire.Protocol.TacticalApi.csproj \
            | sed -E 's#</?TacticalApiProtoRef>##g' | head -1)

          if [ -z "$PINNED_REF" ]; then
            echo "::error::Could not parse <TacticalApiProtoRef> from src .csproj"
            exit 1
          fi

          PINNED=$(gh api "repos/$UPSTREAM_REPO/commits/$PINNED_REF" --jq .sha)
          HEAD=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)
          echo "pinned : $PINNED_REF ($PINNED)"
          echo "head   : $HEAD"

          # Tags: the pin is meant to move to one as soon as upstream cuts
          # one. Newest first is the API's order for a repo that tags in
          # sequence; good enough for a call-out a human reads.
          LATEST_TAG=$(gh api "repos/$UPSTREAM_REPO/tags" --jq '.[0].name // empty')
          LATEST_TAG_SHA=$(gh api "repos/$UPSTREAM_REPO/tags" --jq '.[0].commit.sha // empty')
          echo "tag    : ${LATEST_TAG:-none} ${LATEST_TAG_SHA}"

          if [ "$PINNED" = "$HEAD" ] && { [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG_SHA" = "$PINNED" ]; }; then
            echo "Up to date — nothing to do."
            # If there was a previously-open issue, close it.
            EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Upstream pin $PINNED_REF is now equal to upstream HEAD ($HEAD). Closing automatically."
            fi
            exit 0
          fi

          # Fetch the comparison. The .files[] entries each have status +
          # filename. We split into proto-affecting vs other so the issue
          # body can lead with the relevant section.
          COMPARE=$(gh api "repos/$UPSTREAM_REPO/compare/$PINNED...$HEAD")
          AHEAD=$(echo "$COMPARE" | jq -r '.ahead_by')
          BEHIND=$(echo "$COMPARE" | jq -r '.behind_by')
          PROTO_FILES=$(echo "$COMPARE" | jq -r '.files[]? | select(.filename | startswith("rheinmetall/tactical_api/")) | "- `" + .status + "` " + .filename')
          OTHER_FILES=$(echo "$COMPARE" | jq -r '.files[]? | select(.filename | startswith("rheinmetall/tactical_api/") | not) | "- `" + .status + "` " + .filename')
          COMPARE_URL="https://github.com/$UPSTREAM_REPO/compare/$PINNED...$HEAD"

          # Issue title doubles as a dedupe key — same title means we
          # update the existing open issue rather than spawning a new one.
          if [ "$AHEAD" = "0" ]; then
            TITLE="Upstream tacticalapi has cut tag $LATEST_TAG — move the pin to it"
          else
            TITLE="Upstream tacticalapi is $AHEAD commits ahead of pinned ref"
          fi
          if [ -n "$LATEST_TAG" ]; then
            BUMP_TARGET="to \`$LATEST_TAG\` if that tag covers what you need, otherwise to \`$HEAD\`"
          else
            BUMP_TARGET="to \`$HEAD\`"
          fi

          {
            echo "Upstream is **$AHEAD commits ahead** of the pinned ref \`$PINNED_REF\` (\`$PINNED\`; HEAD now \`$HEAD\`)."
            echo ""
            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG_SHA" != "$PINNED" ]; then
              echo "### Upstream has a tag: \`$LATEST_TAG\` (\`$LATEST_TAG_SHA\`)"
              echo "The pin has waited for one. Move \`<TacticalApiProtoRef>\` to the tag name rather than to a SHA."
              echo ""
            fi
            if [ -n "$PROTO_FILES" ]; then
              echo "### \`.proto\` changes — these affect the generated client"
              echo "$PROTO_FILES"
              echo ""
            else
              echo "_No \`.proto\` file changes — upstream drift is docs / metadata / test client only._"
              echo ""
            fi
            if [ -n "$OTHER_FILES" ]; then
              echo "<details><summary>Other changes ($(echo "$OTHER_FILES" | wc -l) files)</summary>"
              echo ""
              echo "$OTHER_FILES"
              echo ""
              echo "</details>"
              echo ""
            fi
            echo "### Bump procedure"
            echo "1. Verify upstream changes don't break our \`BowireTacticalApiProtocol\` / descriptor lookup."
            echo "2. Update \`<TacticalApiProtoRef>\` in \`src/.../Kuestenlogik.Bowire.Protocol.TacticalApi.csproj\` $BUMP_TARGET."
            echo "   Added files also need an entry in the \`_TacticalApiProtoFile\` group, and a new *service* needs its generated reflection descriptor in \`TacticalApiDescriptors.ServiceFiles\` — nothing else downstream names a file."
            echo "3. \`dotnet pack -c Release\` locally to verify the new \`.proto\` files compile."
            echo "4. Bump the plugin's own version, tag, push."
            echo ""
            echo "Full diff: $COMPARE_URL"
          } > body.md

          EXISTING=$(gh issue list --label "$LABEL" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body-file body.md
          else
            echo "Creating new issue"
            # The label may not exist yet — create it idempotently before opening.
            gh label create "$LABEL" --color BFD4F2 --description "Upstream proto pin drifted; review and bump" 2>/dev/null || true
            gh issue create --title "$TITLE" --body-file body.md --label "$LABEL"
          fi
